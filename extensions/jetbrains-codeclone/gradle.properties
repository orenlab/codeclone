kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Auto-provision JDK 21 for the Gradle daemon when gradle/gradle-daemon-jvm.properties pins it.
org.gradle.java.installations.auto-download=true

# Local IDE for runIde (absolute path). When unset, prefers PyCharm over IntelliJ IDEA.
# codeclone.localIde=/Applications/PyCharm.app

# Remote PyCharm download when no local IDE is found.
codeclone.platformVersion=2025.2.6.1
