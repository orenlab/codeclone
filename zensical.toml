# Zensical configuration for CodeClone docs site.
# Docs: https://zensical.org/docs/

[project]
site_name = "CodeClone"
site_description = "Structural review layer for Python"
site_url = "https://orenlab.github.io/codeclone/"
repo_url = "https://github.com/orenlab/codeclone"
repo_name = "orenlab/codeclone"

docs_dir = "docs"
edit_uri = "blob/main/docs/"

exclude_docs = ["README-pypi.md"]

extra_css = ["assets/stylesheets/extra.css"]

nav = [
    { "Home" = "index.md" },
    { "Get started" = [
        { "Getting started" = "getting-started.md" },
        { "Example report" = "examples/report.md" },
    ] },
    { "Concepts" = [
        { "Structural analysis" = "concepts/structural-analysis.md" },
        { "Health score" = "concepts/health-score.md" },
        { "Blast radius" = "concepts/blast-radius.md" },
        { "Controlled change" = "concepts/controlled-change.md" },
        { "Edit permission and edit_allowed" = "concepts/edit-allowed.md" },
        { "Engineering Memory" = "concepts/engineering-memory.md" },
        { "Review receipts" = "concepts/review-receipts.md" },
        { "MCP interface" = "concepts/mcp.md" },
        { "Reports and baselines" = "concepts/reports.md" },
        { "Project setup" = "concepts/project-setup.md" },
    ] },
    { "Guides" = [
        { "Run the first analysis" = "guides/first-analysis.md" },
        { "Agent-safe change workflow" = "guides/agent-safe-change.md" },
        { "Review a change" = "guides/review-a-change.md" },
        { "Engineering Memory workflow" = "guides/engineering-memory-workflow.md" },
        { "Set up a project" = "guides/setup-project.md" },
        { "CI integration" = "guides/ci-integration.md" },
        { "Development guide" = "guides/development.md" },
    ] },
    { "Integrations" = [
        { "Claude" = "integrations/claude.md" },
        { "Cursor" = "integrations/cursor.md" },
        { "Codex" = "integrations/codex.md" },
        { "VS Code" = "integrations/vscode.md" },
    ] },
    { "Reference" = [
        { "CLI reference" = "reference/cli.md" },
        { "MCP tools reference" = "reference/mcp-tools.md" },
        { "Configuration reference" = "reference/configuration.md" },
        { "Report reference" = "reference/reports.md" },
        { "Memory record types" = "reference/memory-record-types.md" },
        { "JSON output contracts" = "reference/json-output.md" },
        { "Exit codes" = "reference/exit-codes.md" },
        { "Setup command reference" = "reference/setup.md" },
    ] },
    { "Troubleshooting" = [
        { "Overview" = "troubleshooting/index.md" },
        { "Installation" = "troubleshooting/install.md" },
        { "MCP" = "troubleshooting/mcp.md" },
        { "Engineering Memory" = "troubleshooting/memory.md" },
        { "Setup" = "troubleshooting/setup.md" },
        { "Reports" = "troubleshooting/reports.md" },
        { "Terminal output" = "troubleshooting/terminal-output.md" },
    ] },
    { "Legal & plans" = [
        { "Privacy Policy" = "privacy-policy.md" },
        { "Terms of Use" = "terms-of-use.md" },
        { "Plans and Retention" = "plans-and-retention.md" },
    ] },
    { "Maintainers" = [
        { "Docs site" = [
            { "Publishing the docs site" = "publishing.md" },
            { "Releasing & storefront sync" = "releasing.md" },
        ] },
    ] },
]

[project.theme]
logo = "assets/codeclone-docs-wordmark.svg"
favicon = "assets/favicon.svg"

features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "navigation.instant",
    "navigation.tracking",
    "search.highlight",
    "content.code.copy",
    "content.tabs.link",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "default"
primary = "white"
accent = "indigo"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "indigo"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
