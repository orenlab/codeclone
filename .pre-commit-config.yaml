default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-ast
      - id: debug-statements
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: forbid-submodules

  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff (format)
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-check
        name: Ruff (lint)
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: Mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: codeclone
        name: CodeClone
        entry: uv run codeclone
        language: system
        pass_filenames: false
        args: [".", "--ci"]
        always_run: true
        stages: [pre-commit]

      - id: pytest
        name: Pytest
        entry: uv run pytest -q --cov=codeclone --cov-report=term-missing --cov-fail-under=99
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: lint-admonitions
        name: Lint admonitions
        entry: uv run scripts/lint_admonitions.py docs/ --fix
        language: system
        pass_filenames: false
        files: ^docs/.*\.md$
        stages: [ pre-commit ]

      - id: lint-agents-authority
        name: Lint AGENTS.md authority model
        entry: uv run scripts/lint_agents_authority.py AGENTS.md
        language: system
        pass_filenames: false
        files: ^AGENTS\.md$
        stages: [ pre-commit ]

      # This gate is handed three roots, not the repository. Measured
      # 2026-09-04: 592 of 1183 tracked Python files, so a type error under
      # tests/, scripts/ or plugins/ leaves it green -- the name says which
      # population the green is about, because the id and the output did not.
      # mypy (above) is what covers tests/; nothing covers scripts/ or
      # plugins/. tests/test_type_check_population.py reconciles both `ty`
      # declarations against git and reds when either side drifts.
      - id: ty-prod-scope
        name: Ty (production scope only; not tests/, scripts/, plugins/)
        entry: bash -c 'uv run ty check codeclone .github/actions benchmarks'
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]
