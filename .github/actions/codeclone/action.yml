name: CodeClone
description: >
  Structural code health analysis for Python with baseline-aware CI gating,
  SARIF upload, and PR-friendly summaries.

author: OrenLab

branding:
  icon: copy
  color: purple

inputs:
  python-version:
    description: "Python version"
    required: false
    default: "3.14"

  package-version:
    description: "CodeClone version from PyPI for remote installs (ignored when the action runs from the checked-out CodeClone repo)"
    required: false
    default: "2.0.2"

  path:
    description: "Project root"
    required: false
    default: "."

  json-path:
    description: "Canonical JSON report output path"
    required: false
    default: ".cache/codeclone/report.json"

  sarif:
    description: "Generate SARIF and upload to Code Scanning"
    required: false
    default: "true"

  sarif-path:
    description: "SARIF output path"
    required: false
    default: ".cache/codeclone/report.sarif"

  pr-comment:
    description: "Post or update a PR summary comment"
    required: false
    default: "true"

  fail-on-new:
    description: "Fail if new clone groups are detected"
    required: false
    default: "true"

  fail-on-new-metrics:
    description: "Fail if metrics regress vs baseline"
    required: false
    default: "false"

  fail-threshold:
    description: "Max allowed function+block clone groups (-1 = disabled)"
    required: false
    default: "-1"

  fail-complexity:
    description: "Max cyclomatic complexity (-1 = disabled)"
    required: false
    default: "-1"

  fail-coupling:
    description: "Max coupling CBO (-1 = disabled)"
    required: false
    default: "-1"

  fail-cohesion:
    description: "Max cohesion LCOM4 (-1 = disabled)"
    required: false
    default: "-1"

  fail-cycles:
    description: "Fail if dependency cycles are detected"
    required: false
    default: "false"

  fail-dead-code:
    description: "Fail if high-confidence dead code is detected"
    required: false
    default: "false"

  fail-health:
    description: "Minimum health score (-1 = disabled)"
    required: false
    default: "-1"

  require-baseline:
    description: "Fail if the baseline file is missing"
    required: false
    default: "true"

  baseline-path:
    description: "Baseline path passed to CodeClone"
    required: false
    default: "codeclone.baseline.json"

  metrics-baseline-path:
    description: "Metrics baseline path passed to CodeClone"
    required: false
    default: "codeclone.baseline.json"

  extra-args:
    description: "Additional CodeClone CLI arguments"
    required: false
    default: ""

  no-progress:
    description: "Disable progress output"
    required: false
    default: "true"

outputs:
  exit-code:
    description: "CodeClone process exit code"
    value: ${{ steps.analysis.outputs.exit-code }}
  json-path:
    description: "Resolved JSON report path"
    value: ${{ steps.analysis.outputs.json-path }}
  sarif-path:
    description: "Resolved SARIF report path"
    value: ${{ steps.analysis.outputs.sarif-path }}
  pr-comment-id:
    description: "Updated PR comment id when a PR comment was posted"
    value: ${{ steps.post-pr-comment.outputs.comment-id }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Resolve CodeClone install target
      id: resolve-install
      shell: bash
      env:
        CODECLONE_VERSION: ${{ inputs.package-version }}
      run: |
        python - <<'PY'
        import os
        import sys

        sys.path.insert(0, os.environ["GITHUB_ACTION_PATH"])

        from _action_impl import resolve_install_target, write_outputs

        target = resolve_install_target(
            action_path=os.environ["GITHUB_ACTION_PATH"],
            workspace=os.environ["GITHUB_WORKSPACE"],
            package_version=os.environ.get("CODECLONE_VERSION", ""),
        )
        print(f"Resolved CodeClone install source: {target.source} ({target.requirement})")
        github_output = os.environ.get("GITHUB_OUTPUT")
        if github_output:
            write_outputs(
                github_output,
                {
                    "install-spec": target.requirement,
                    "install-source": target.source,
                    "install-requirements": target.requirements_file,
                },
            )
        PY

    - name: Install CodeClone
      shell: bash
      env:
        INSTALL_SPEC: ${{ steps.resolve-install.outputs.install-spec }}
        INSTALL_SOURCE: ${{ steps.resolve-install.outputs.install-source }}
        INSTALL_REQUIREMENTS: ${{ steps.resolve-install.outputs.install-requirements }}
        # The runner's own pip may vendor a CA bundle that still trusts the
        # eMudhra chains revoked in October 2026, so it never downloads here:
        # pip 26.2.2 is fetched directly, checked against its published
        # SHA-256, and installed from the local file.
        PIP_BOOTSTRAP_URL: https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl
        PIP_BOOTSTRAP_SHA256: fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70
      run: |
        pip_wheel="${RUNNER_TEMP}/pip-26.2.2-py3-none-any.whl"
        curl --fail --silent --show-error --location --retry 3 --proto '=https' \
          --output "${pip_wheel}" "${PIP_BOOTSTRAP_URL}"
        PIP_BOOTSTRAP_WHEEL="${pip_wheel}" python - <<'PY'
        import hashlib
        import os
        import sys

        wheel = os.environ["PIP_BOOTSTRAP_WHEEL"]
        expected = os.environ["PIP_BOOTSTRAP_SHA256"]
        with open(wheel, "rb") as handle:
            actual = hashlib.sha256(handle.read()).hexdigest()
        if actual != expected:
            print(
                f"Refusing to install pip from {wheel}: its SHA-256 is {actual}, "
                f"expected {expected}.",
                file=sys.stderr,
            )
            raise SystemExit(1)
        PY
        python -m pip install --no-index --no-deps --disable-pip-version-check "${pip_wheel}"
        echo "Installing CodeClone from ${INSTALL_SOURCE}: ${INSTALL_SPEC}"
        if [ -n "${INSTALL_REQUIREMENTS}" ]; then
          # The shipped version installs exactly the wheels pinned by SHA-256 in
          # requirements.txt: no resolution beyond that set, no source builds.
          python -m pip install --require-hashes --only-binary :all: \
            --disable-pip-version-check -r "${INSTALL_REQUIREMENTS}"
        else
          python -m pip install "${INSTALL_SPEC}"
        fi

    - name: Verify baseline
      if: ${{ inputs.require-baseline == 'true' }}
      shell: bash
      env:
        INPUT_PROJECT_PATH: ${{ inputs.path }}
        INPUT_BASELINE_PATH: ${{ inputs.baseline-path }}
      run: |
        python - <<'PY'
        import os
        import sys
        from pathlib import Path

        project_root = Path(os.environ["INPUT_PROJECT_PATH"])
        baseline_path = Path(os.environ["INPUT_BASELINE_PATH"])
        target = baseline_path if baseline_path.is_absolute() else project_root / baseline_path
        if not target.exists():
            print(f"Missing required CodeClone baseline: {target}", file=sys.stderr)
            raise SystemExit(1)
        PY

    - name: Run CodeClone
      id: analysis
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_JSON_PATH: ${{ inputs.json-path }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_SARIF_PATH: ${{ inputs.sarif-path }}
        INPUT_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        INPUT_FAIL_ON_NEW_METRICS: ${{ inputs.fail-on-new-metrics }}
        INPUT_FAIL_THRESHOLD: ${{ inputs.fail-threshold }}
        INPUT_FAIL_COMPLEXITY: ${{ inputs.fail-complexity }}
        INPUT_FAIL_COUPLING: ${{ inputs.fail-coupling }}
        INPUT_FAIL_COHESION: ${{ inputs.fail-cohesion }}
        INPUT_FAIL_CYCLES: ${{ inputs.fail-cycles }}
        INPUT_FAIL_DEAD_CODE: ${{ inputs.fail-dead-code }}
        INPUT_FAIL_HEALTH: ${{ inputs.fail-health }}
        INPUT_BASELINE_PATH: ${{ inputs.baseline-path }}
        INPUT_METRICS_BASELINE_PATH: ${{ inputs.metrics-baseline-path }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        INPUT_NO_PROGRESS: ${{ inputs.no-progress }}
      run: |
        python "${{ github.action_path }}/run_codeclone.py"

    - name: Render PR summary
      id: render-pr-comment
      if: ${{ inputs.pr-comment == 'true' && github.event_name == 'pull_request' && steps.analysis.outputs.json-exists == 'true' }}
      shell: bash
      env:
        REPORT_PATH: ${{ steps.analysis.outputs.json-path }}
        ANALYSIS_EXIT_CODE: ${{ steps.analysis.outputs.exit-code }}
        COMMENT_OUTPUT_PATH: ${{ runner.temp }}/codeclone-pr-comment.md
      run: |
        python "${{ github.action_path }}/render_pr_comment.py"

    - name: Upload SARIF
      if: ${{ always() && inputs.sarif == 'true' && steps.analysis.outputs.sarif-exists == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        sarif_file: ${{ steps.analysis.outputs.sarif-path }}
        category: codeclone

    - name: Post or update PR comment
      id: post-pr-comment
      if: ${{ always() && inputs.pr-comment == 'true' && github.event_name == 'pull_request' && steps.render-pr-comment.outputs.comment-exists == 'true' }}
      continue-on-error: true
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        COMMENT_BODY_PATH: ${{ steps.render-pr-comment.outputs.comment-body-path }}
        COMMENT_MARKER: "<!-- codeclone-report -->"
      with:
        script: |
          const fs = require("fs");
          const body = fs.readFileSync(process.env.COMMENT_BODY_PATH, "utf8");
          const marker = process.env.COMMENT_MARKER;
          const issue_number = context.issue.number;
          const { owner, repo } = context.repo;

          const comments = await github.paginate(
            github.rest.issues.listComments,
            {
              owner,
              repo,
              issue_number,
              per_page: 100,
            },
          );

          const existing = comments.find(
            (comment) =>
              comment.user &&
              comment.user.type === "Bot" &&
              comment.body &&
              comment.body.includes(marker),
          );

          let result;
          if (existing) {
            result = await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            result = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }

          core.setOutput("comment-id", String(result.data.id));

    - name: Gate result
      if: ${{ always() }}
      shell: bash
      run: |
        status="${{ steps.analysis.outputs.exit-code }}"
        if [ -z "${status}" ]; then
          echo "CodeClone analysis did not produce an exit code." >&2
          exit 2
        fi
        exit "${status}"
