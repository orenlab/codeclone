name: integrations
run-name: integrations • ${{ github.event_name }} • ${{ github.ref_name }}

# Tests the IDE/agent integration surfaces that the main `tests` workflow does
# not cover: the Node-based VS Code extension and Claude Desktop bundle, plus
# the Codex and Cursor plugin contract tests. Runs only when an integration
# surface (or the shared MCP tool snapshot the manifests are pinned to) changes.

on:
  push:
    branches: [ "**" ]
    paths:
      - "extensions/**"
      - "plugins/**"
      - "tests/test_codex_plugin.py"
      - "tests/test_cursor_plugin.py"
      - "tests/test_cursor_plugin_hooks.py"
      - "tests/fixtures/contract_snapshots/mcp_tool_schemas.json"
      - ".github/workflows/integrations.yml"
  pull_request:
    paths:
      - "extensions/**"
      - "plugins/**"
      - "tests/test_codex_plugin.py"
      - "tests/test_cursor_plugin.py"
      - "tests/test_cursor_plugin_hooks.py"
      - "tests/fixtures/contract_snapshots/mcp_tool_schemas.json"
      - ".github/workflows/integrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode-codeclone
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/vscode-codeclone/package-lock.json

      # Installing a dependency grants it no right to run code: no npm
      # lifecycle scripts run during this install. That is all the flag
      # covers: the explicit `npm run check` and `npm test` below still run
      # dependency code. Optional dependencies stay included, because
      # esbuild's platform binary arrives through them.
      # Two separate contracts; one does not replace the other:
      #   configuration - this command, `persist-credentials: false` and the
      #     step order are pinned by tests/test_integrations_workflow_contract.py;
      #   environment - the next step proves the locked esbuild is actually
      #     installed and runs on this runner (test/verifyToolchain.js).
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --include=optional

      - name: Verify esbuild (lock version, platform binary, transform)
        run: node test/verifyToolchain.js linux-x64

      - name: Build, typecheck, and syntax-check
        run: npm run check

      - name: Unit tests
        run: npm test

  claude-desktop-bundle:
    name: Claude Desktop bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/claude-desktop-codeclone
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: extensions/claude-desktop-codeclone/package-lock.json

      # Same install policy as the VS Code job: no npm lifecycle scripts run
      # during this install; the explicit steps below still run package code.
      # Pinned statically by tests/test_integrations_workflow_contract.py.
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --include=optional

      - name: Syntax-check launcher and server
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Bundle build smoke
        run: npm run pack

  plugins:
    name: Codex and Cursor plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp

      - name: Plugin contract tests
        run: >-
          uv run pytest -q
          tests/test_codex_plugin.py
          tests/test_cursor_plugin.py
          tests/test_cursor_plugin_hooks.py

      - name: Validate bundled plugin manifests
        run: |
          python3 -m json.tool plugins/codeclone/.codex-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/codeclone/.mcp.json > /dev/null
          python3 -m json.tool .agents/plugins/marketplace.json > /dev/null
