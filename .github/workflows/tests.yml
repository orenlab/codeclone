name: tests

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14", "3.15" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      # Ty runs on every matrix interpreter rather than once beside mypy, because
      # its verdict depends on what each environment actually resolves. Measured
      # 2026-08-30: `overrides` is installed only for Python < 3.12 (lancedb's own
      # marker), so the vendor base class resolves on 3.10 and 3.11 and is Unknown
      # from 3.12 up. A protocol mismatch planted in lancedb_backend.py -- a
      # positional `schema`, which the real create_table binds to `data` -- was
      # caught on 3.10 and 3.11 and passed silently on 3.12, 3.13 and 3.14. A
      # single 3.14 run would be a gate blind to the defect class it exists for.
      #
      # The three roots are not the repository's Python population. Measured
      # 2026-09-04: 592 of 1183 tracked files, so this step is silent about
      # any change confined to tests/, scripts/ or plugins/. The Mypy step in
      # the lint job is what covers tests/. This name and the pre-commit hook
      # name state that scope, and tests/test_type_check_population.py reds if
      # the two declarations drift apart or if a root leaves either gate.
      - name: Ty (production scope only; not tests/, scripts/, plugins/)
        run: uv run ty check codeclone .github/actions benchmarks

      # Smoke CLI tests intentionally disable subprocess coverage collection
      # to avoid runner-specific flakiness while keeping parent-process coverage strict.
      #
      # The 99% floor runs on every leg except 3.15. There, four extras
      # (analytics, semantic-lancedb, semantic-fastembed, semantic-local)
      # resolve to nothing because nothing upstream ships a cp315 distribution
      # -- see the marker block in pyproject.toml -- so their tests skip and the
      # covered population is provably smaller than the one the floor was
      # calibrated on. Holding the floor against a smaller population compares
      # two different measurements, which is why the floor is dropped rather
      # than lowered. The tests themselves still gate 3.15: a failure there
      # fails this job. The condition is spelled `!= '3.15'` so that a future
      # interpreter inherits the floor instead of silently losing it.
      - name: Run tests
        if: ${{ matrix.python-version != '3.15' }}
        run: uv run pytest --cov=codeclone --cov-report=term-missing --cov-fail-under=99

      - name: Run tests (no coverage floor)
        if: ${{ matrix.python-version == '3.15' }}
        run: uv run pytest

      - name: Verify baseline exists
        if: ${{ matrix.python-version == '3.14' }}
        run: test -f codeclone.baseline.json

      - name: Check for new clones vs baseline
        if: ${{ matrix.python-version == '3.14' }}
        run: uv run codeclone . --ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy
