name: tests

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      # Ty runs on every matrix interpreter rather than once beside mypy, because
      # its verdict depends on what each environment actually resolves. Measured
      # 2026-08-30: `overrides` is installed only for Python < 3.12 (lancedb's own
      # marker), so the vendor base class resolves on 3.10 and 3.11 and is Unknown
      # from 3.12 up. A protocol mismatch planted in lancedb_backend.py -- a
      # positional `schema`, which the real create_table binds to `data` -- was
      # caught on 3.10 and 3.11 and passed silently on 3.12, 3.13 and 3.14. A
      # single 3.14 run would be a gate blind to the defect class it exists for.
      - name: Ty check production scope
        run: uv run ty check codeclone .github/actions benchmarks

      - name: Run tests
        # Smoke CLI tests intentionally disable subprocess coverage collection
        # to avoid runner-specific flakiness while keeping parent-process coverage strict.
        run: uv run pytest --cov=codeclone --cov-report=term-missing --cov-fail-under=99

      - name: Verify baseline exists
        if: ${{ matrix.python-version == '3.14' }}
        run: test -f codeclone.baseline.json

      - name: Check for new clones vs baseline
        if: ${{ matrix.python-version == '3.14' }}
        run: uv run codeclone . --ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy
