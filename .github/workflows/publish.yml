name: publish
run-name: >-
  publish • ${{ github.event_name }} •
  ${{ github.event.release.tag_name || inputs.repository || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: Target package index
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Verify release tag matches project version
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(python - <<'PY'
          import pathlib, tomllib
          payload = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(payload["project"]["version"])
          PY
          )"
          release_tag="${{ github.event.release.tag_name }}"
          normalized_tag="${release_tag#v}"
          if [ "$normalized_tag" != "$project_version" ]; then
            echo "release tag $release_tag does not match project version $project_version" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv run --with build==1.5.0 python -m build --sdist --wheel

      - name: Validate distributions
        run: uv run --with twine==6.2.0 twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: >-
      ${{
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
      }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-registry:
    if: >-
      ${{
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
      }}
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "${RUNNER_TEMP}" mcp-publisher

      - name: Validate server.json
        run: '"${RUNNER_TEMP}/mcp-publisher" validate server.json'

      - name: Authenticate to the MCP Registry
        run: '"${RUNNER_TEMP}/mcp-publisher" login github-oidc'

      - name: Publish to the MCP Registry
        run: '"${RUNNER_TEMP}/mcp-publisher" publish server.json'
