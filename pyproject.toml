[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeclone"
version = "2.1.0a2"
description = "Structural Change Controller for AI-assisted Python development — baseline-aware, deterministic, built for CI and AI agents"
readme = { file = "docs/README-pypi.md", content-type = "text/markdown" }
license = "MPL-2.0 AND MIT"
license-files = ["LICENSE", "LICENSE-MIT"]

authors = [
    { name = "Den Rozhnovskiy", email = "pytelemonbot@mail.ru" }
]
maintainers = [
    { name = "Den Rozhnovskiy", email = "pytelemonbot@mail.ru" }
]

requires-python = ">=3.10"

dependencies = [
    "orjson>=3.11.9",
    "packaging>=24.0",
    "pydantic>=2.13.4",
    "pygments>=2.20.0",
    "rich>=15.0.0",
    "tomlkit>=0.15.1",
    "tomli>=2.0.1; python_version < '3.11'",
]

keywords = [
    "python",
    "ast",
    "cfg",
    "code-clone",
    "duplication",
    "static-analysis",
    "architecture",
    "control-flow",
    "ci",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/orenlab/codeclone"
Repository = "https://github.com/orenlab/codeclone"
Issues = "https://github.com/orenlab/codeclone/issues"
Changelog = "https://github.com/orenlab/codeclone/releases"
Documentation = "https://orenlab.github.io/codeclone/"

[project.optional-dependencies]
mcp = [
    "mcp>=1.29.0,<2",
    "httpx>=0.27.1,<1",
]
token-bench = [
    "tiktoken>=0.13.0",
]
coverage-xml = [
    "defusedxml>=0.7.1,<0.8",
]
semantic-lancedb = [
    "lancedb>=0.36.0",
]
semantic-fastembed = [
    "fastembed>=0.8.0,<0.9",
]
semantic-local = [
    "lancedb>=0.36.0",
    "fastembed>=0.8.0,<0.9",
]
analytics = [
    "hdbscan>=0.8.0",
    "scikit-learn>=1.5.0",
    "lancedb>=0.36.0",
    "fastembed>=0.8.0,<0.9",
    "umap-learn>=0.5.6; python_version < '3.14'",
    # umap-learn → pynndescent → numba/llvmlite.
    # pynndescent 0.5.x allows llvmlite>=0.30 → uv may pick 0.36 (Python <3.10 only).
    # Floors keep the JIT stack on 3.10–3.13 wheels; numba pins llvmlite in its band.
    "pynndescent>=0.6.0; python_version < '3.14'",
    "numba>=0.61.0,<0.66; python_version < '3.14'",
    "llvmlite>=0.44.0,<0.48; python_version < '3.14'",
]
perf = [
    "psutil>=7,<8",
]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "build>=1.5.0",
    "twine>=7.0.0",
    "mypy>=2.3.0",
    "ruff>=0.16.1",
    "pre-commit>=4.6.1",
    "ty>=0.0.66",
    "PyYAML>=6.0.2",
    "jsonschema>=4.23.0",
    "types-PyYAML>=6.0.12.20260724",
    "types-jsonschema>=4.23.0.20250516",
    "ckdn[mcp]>=1.0.0; python_version > '3.11'",
]

[project.scripts]
codeclone = "codeclone.main:main"
codeclone-mcp = "codeclone.surfaces.mcp.server:main"

[tool.setuptools]
packages = [
    "codeclone",
    "codeclone.analysis",
    "codeclone.analytics",
    "codeclone.analytics.clustering",
    "codeclone.analytics.corpus",
    "codeclone.analytics.corpus.adapters",
    "codeclone.analytics.corpus.representations",
    "codeclone.analytics.embedding",
    "codeclone.analytics.export",
    "codeclone.analytics.metrics",
    "codeclone.analytics.profiles",
    "codeclone.analytics.profiles.manifests",
    "codeclone.analytics.report",
    "codeclone.analytics.report.messages",
    "codeclone.analytics.store",
    "codeclone.api",
    "codeclone.audit",
    "codeclone.baseline",
    "codeclone.blocks",
    "codeclone.budget",
    "codeclone.cache",
    "codeclone.config",
    "codeclone.contracts",
    "codeclone.controller_insights",
    "codeclone.core",
    "codeclone.findings",
    "codeclone.findings.clones",
    "codeclone.findings.design",
    "codeclone.findings.structural",
    "codeclone.domain",
    "codeclone.meta_markers",
    "codeclone.metrics",
    "codeclone.memory",
    "codeclone.memory.embedding",
    "codeclone.memory.experience",
    "codeclone.memory.ingest",
    "codeclone.memory.jobs",
    "codeclone.memory.retrieval",
    "codeclone.memory.semantic",
    "codeclone.memory.trajectory",
    "codeclone.observability",
    "codeclone.observability.store",
    "codeclone.observations",
    "codeclone.paths",
    "codeclone.paths.module_identity",
    "codeclone.qualnames",
    "codeclone.report",
    "codeclone.report.document",
    "codeclone.report.gates",
    "codeclone.report.html",
    "codeclone.report.html.assets",
    "codeclone.report.html.primitives",
    "codeclone.report.html.sections",
    "codeclone.report.html.widgets",
    "codeclone.report.messages",
    "codeclone.report.renderers",
    "codeclone.scanner",
    "codeclone.semantics",
    "codeclone.surfaces",
    "codeclone.surfaces.cli",
    "codeclone.surfaces.cli.ui",
    "codeclone.surfaces.cli.setup",
    "codeclone.surfaces.cli.setup.engine",
    "codeclone.surfaces.mcp",
    "codeclone.surfaces.mcp.messages",
    "codeclone.surfaces.mcp.tools",
    "codeclone.ui_messages",
    "codeclone.utils",
    "codeclone.workspace_intent",
]

[tool.setuptools.package-data]
codeclone = ["py.typed"]
"codeclone.analytics.profiles.manifests" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "needs_sqlite_cleanup: run expensive gc.get_objects() sqlite teardown after this test (fallback when connect tracking misses leaks)",
]

[tool.coverage.run]
branch = true
source = ["codeclone"]
omit = [
    # Protocol-only interface. Concrete memory stores are covered by shared
    # store contract tests. Do not add behavior to this module while omitted.
    "codeclone/memory/store.py",
]

[tool.codeclone]
baseline = "codeclone.baseline.json"
baseline_scope_id = "019f7fa1-8866-7242-b0bf-0ff282cafbcb"
max_baseline_size_mb = 3
min_loc = 6
min_stmt = 4
fail_on_new = true
fail_cycles = true
fail_dead_code = true
# The floor equals the health this repository measures, ratified at the last
# landing. It moves only with a maintainer ratification that follows a fresh
# measurement, never ahead of one, and a semantic recalibration supersedes the
# older measurement rather than being weighed against it -- which is why
# 80 -> 73 (honest findings made visible) and 73 -> 91 (a stale record
# corrected and the complexity dimension recalibrated) are both the same rule
# applied twice, not the gate opening backwards. The ratchet is on the honesty
# of the measure, not on the number. Owning assertion:
# tests/test_self_gate_thresholds.py.
fail_health = 91
fail_on_new_metrics = true
semantic_authority = true
fail_on_authority_violation = true
api_surface = true
# Fixture corpora whose clone groups are corpus construction rather than
# findings about this project: each tree states its ground truth by pairing an
# original with a renamed copy, so the twins are the point of the fixture. They
# go through the golden_fixture channel, which keeps a visible counter and can
# never silence production code, instead of sitting in the baseline as noise.
# Named one by one on purpose - this list is a declaration, and a wider glob
# would silently adopt future fixture trees nobody reviewed. Owning assertion:
# tests/test_golden_fixtures.py.
golden_fixture_paths = [
    "tests/fixtures/golden_*",
    "tests/fixtures/clone_tiers",
    "tests/fixtures/design_metrics",
    "tests/fixtures/fingerprint_binding",
    "tests/fixtures/liveness_policy",
    "tests/fixtures/near_miss_witness",
    "tests/fixtures/source_kind",
    "tests/fixtures/statement_reachability",
]
min_typing_coverage = 99
intent_registry_backend = "sqlite"
intent_registry_path = ".codeclone/db/intents.sqlite3"
intent_registry_retention_days = 30
audit_enabled = true
audit_path = ".codeclone/db/audit.sqlite3"
audit_payloads = "full"    # "off" | "compact" | "full"
audit_retention_days = 30

[[tool.codeclone.authority]]
contract_id = "baseline.publication/v1"
canonical_owner = "codeclone.baseline.publish:publish_baseline"
allowed_adapters = []
forbidden_raw_inputs = []
required_provenance = ["codeclone.baseline.publish:publish_baseline"]

[[tool.codeclone.authority]]
contract_id = "clone.fingerprint_wire/v1"
canonical_owner = "codeclone.analysis.wire:emit_wire"
allowed_adapters = []
forbidden_raw_inputs = []
required_provenance = ["codeclone.analysis.wire:emit_wire"]

[[tool.codeclone.authority]]
contract_id = "compatibility.verdict/v1"
canonical_owner = "codeclone.contracts.compatibility:check_contract_compatibility"
allowed_adapters = []
forbidden_raw_inputs = []
required_provenance = [
    "codeclone.contracts.compatibility:check_contract_compatibility",
]

[[tool.codeclone.authority]]
contract_id = "python.module_identity/v2"
canonical_owner = "codeclone.paths.module_identity.resolver:resolve_source_identity"
allowed_adapters = []
forbidden_raw_inputs = []
required_provenance = [
    "codeclone.paths.module_identity.resolver:resolve_source_identity",
]

[[tool.codeclone.authority]]
contract_id = "report.run_identity/v1"
canonical_owner = "codeclone.report.document.integrity:_build_integrity_payload"
allowed_adapters = []
forbidden_raw_inputs = []
required_provenance = [
    "codeclone.report.document.integrity:_build_integrity_payload",
]

[tool.codeclone.memory]
projection_rebuild_policy = "enqueue_when_stale"              # off | enqueue_when_stale
projection_rebuild_running_timeout_seconds = 1800
projection_rebuild_spawn_worker = true

[tool.codeclone.memory.semantic]
enabled = true                          # default: off, zero extra deps
backend = "lancedb"
index_path = ".codeclone/memory/semantic_index.lance"
embedding_provider = "fastembed"        # diagnostic | fastembed | local_model | api
embedding_model = "BAAI/bge-small-en-v1.5"  # used by fastembed
embedding_cache_dir = ".codeclone/memory/fastembed"  # used by fastembed
allow_model_download = true             # fastembed: download if cache is missing
dimension = 384
max_results = 20
index_audit = true                       # project audit summaries when audit DB exists

[tool.codeclone.memory.ingest]
contract_constants_paths = ["codeclone/contracts/__init__.py"]
document_link_paths = [
    "docs/concepts/mcp.md",
    "AGENTS.md",
    "CLAUDE.md",
]
mcp_tool_schema_snapshot_path = "tests/fixtures/contract_snapshots/mcp_tool_schemas.json"
mcp_tool_count_doc_paths = ["docs/reference/mcp-tools.md"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 99

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["benchmarks", "codeclone", "tests"]
exclude = [
    "^build/",
    "^site/",
    "^plugins/cursor-codeclone/scripts/launch_mcp\\.py$",
]

[[tool.mypy.overrides]]
module = [
    "codeclone.surfaces.mcp._session_memory_mixin",
    "codeclone.surfaces.mcp._session_blast_radius_mixin",
    "codeclone.surfaces.mcp._session_claim_guard_mixin",
    "codeclone.surfaces.mcp._session_intent_mixin",
    "codeclone.surfaces.mcp._session_patch_contract_mixin",
    "codeclone.surfaces.mcp._session_review_receipt_mixin",
    "codeclone.surfaces.mcp._session_workflow_mixin",
]
disable_error_code = ["attr-defined", "misc"]

[[tool.mypy.overrides]]
# psutil is an optional dependency (codeclone[perf]); allow mypy to pass whether
# or not it is installed in the checking environment.
module = ["psutil"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy arrives only as a transitive dependency (we never import it directly).
# Its installed stubs use PEP 695 `type` statements that mypy refuses to parse
# under python_version = "3.10" (which we keep, since we support 3.10+). Skip
# following mypy into numpy's stubs so the hook does not choke on .venv.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "PERF", "RUF"]

[tool.ruff.lint.per-file-ignores]
"codeclone/report/html/assets/*.py" = ["E501"]
"codeclone/report/html/sections/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
